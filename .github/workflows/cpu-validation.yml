name: Portable CPU validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  decoder:
    name: Decoder on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch
      - name: Install validation dependencies
        run: python -m pip install numpy transformers safetensors pytest psutil tokenizers jinja2 huggingface-hub pyarrow setuptools wheel
      - name: Configure portable build
        run: cmake -S engine -B build/ci -DCMAKE_BUILD_TYPE=Release -DLEAF_ENABLE_AVX2=OFF
      - name: Build native decoder and primitive tests
        run: cmake --build build/ci --config Release --target leaf_decoder leaf_embed leaf_token_panel_tests leaf_attention_vector_tests leaf_silu_gate_tests leaf_gelu_erf_tests leaf_decoder_final_rows_tests
      - name: Token-panel, attention, SiLU and GELU primitive correctness
        run: ctest --test-dir build/ci -C Release --output-on-failure -R '^leaf_(token_panel|attention_vector|silu_gate|gelu_erf)_tests$'
      - name: Python decoder, CLI and dataset tests
        run: python -m pytest tests/unit/test_decoder_plan.py tests/unit/test_generation_policy.py tests/unit/test_decoder_precision_policy.py tests/unit/test_decoder_export_provenance.py tests/unit/test_decoder_latency_phases.py tests/unit/test_decoder_comparison.py tests/unit/test_core_scaling.py tests/unit/test_prefill_diagnostics.py tests/unit/test_datasets.py tests/unit/test_cli.py tests/unit/test_tokenizer_parity.py tests/unit/test_decoder_quality.py tests/unit/test_silu_gate_experiment.py tests/unit/test_affinity.py tests/unit/test_power.py tests/unit/test_packaging.py tests/unit/test_package_runtime.py tests/unit/test_benchmark_cli.py -q
      - name: Diagnostic telemetry contracts
        run: python -m pytest tests/unit/test_windows_benchmark_diagnostics.py tests/unit/test_silu_release.py tests/unit/test_default_abba_target.py tests/unit/test_decoder_trace.py tests/unit/test_accumulation_acceptance.py tests/unit/test_model_inspection.py tests/unit/test_output_evaluation.py tests/unit/test_runtime_check.py tests/unit/test_ollama_validation.py -q
      - name: Embedding import and numerical contracts
        run: python -m pytest tests/unit/test_embedding_export.py tests/unit/test_embedding_reference.py tests/unit/test_embedding_cli.py tests/unit/test_embedding_download.py tests/unit/test_embedding_comparison.py tests/unit/test_embedding_diagnostics.py -q
      - name: Reduced bidirectional embedding validation
        shell: bash
        run: |
          runtime=build/ci/leaf_embed
          if [ "${{ runner.os }}" = "Windows" ]; then runtime=build/ci/Release/leaf_embed.exe; fi
          python tools/verify_embedding_architectures.py --executable "$runtime" --output benchmark/results/embedding-ci.json
      - name: Full reduced-model architecture validation
        shell: bash
        run: |
          runtime=build/ci/leaf_decoder
          if [ "${{ runner.os }}" = "Windows" ]; then runtime=build/ci/Release/leaf_decoder.exe; fi
          python tools/verify_decoder_architectures.py --executable "$runtime" --expect-silu-defaults --output benchmark/results/decoder-ci.json
      - name: Causal sliding-window decoder validation
        shell: bash
        run: |
          runtime=build/ci/leaf_decoder
          if [ "${{ runner.os }}" = "Windows" ]; then runtime=build/ci/Release/leaf_decoder.exe; fi
          python tools/verify_sliding_window_decoder.py --executable "$runtime" --output build/sliding-window-ci
      - name: Native multi-EOS generation and artifact validation
        shell: bash
        run: |
          runtime=build/ci/leaf_decoder
          if [ "${{ runner.os }}" = "Windows" ]; then runtime=build/ci/Release/leaf_decoder.exe; fi
          LEAF_TEST_DECODER_BIN="$runtime" python -m pytest tests/unit/test_decoder_generation_format.py -q
      - name: Final-layer last-logit and cache validation
        shell: bash
        run: |
          runtime=build/ci/leaf_decoder_final_rows_tests
          if [ "${{ runner.os }}" = "Windows" ]; then runtime=build/ci/Release/leaf_decoder_final_rows_tests.exe; fi
          python tools/verify_final_layer_rows.py --after "$runtime" --output build/final-rows-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-validation-${{ matrix.os }}
          path: |
            benchmark/results/decoder-ci.json
            benchmark/results/embedding-ci.json
            build/sliding-window-ci/validation.json
            build/final-rows-ci/validation.json
